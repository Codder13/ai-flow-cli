[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-flow-cli"
version = "0.8.1"
description = "⚡ Fast, beautiful AI CLI wrapper around modern coding harnesses for Unix pipelines"
readme = "README.md"
dependencies = [
    "rich>=13.0.0",
    "pylatexenc>=2.10",
]
license = { text = "MIT" }
keywords = ["ai", "cli", "omp", "pi", "claude", "streaming", "llm", "terminal", "unix-pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.scripts]
ai = "ai_cli.main:main"

[project.urls]
Homepage = "https://github.com/Codder13/ai-flow-cli"
Repository = "https://github.com/Codder13/ai-flow-cli.git"
Issues = "https://github.com/Codder13/ai-flow-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
